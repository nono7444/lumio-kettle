<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Lecteur Lumio Kettle</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  p{color:#aaa;font:15px system-ui;text-align:center;margin-top:40vh}
</style>
</head>
<body>
<script>
  // Lecteur YouTube servi depuis une adresse https : YouTube refuse
  // les lecteurs intégrés directement dans une appli (erreur 153).
  var v = new URLSearchParams(location.search).get('v') || '';
  if (/^[\w-]{11}$/.test(v)) {
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube.com/embed/' + v +
      '?autoplay=1&playsinline=1&rel=0&modestbranding=1&loop=1&playlist=' + v;
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.allowFullscreen = true;
    document.body.appendChild(f);
  } else {
    document.body.innerHTML = '<p>Vidéo introuvable</p>';
  }
</script>
</body>
</html>
